name: probe-g4 digest
description: Prints the state digest line from a script file.
inputs:
  file:
    required: false
    default: ''
  state-path:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FILE: ${{ inputs.file }}
        STATE_PATH: ${{ inputs.state-path }}
      run: bash "$GITHUB_ACTION_PATH/digest.sh"
