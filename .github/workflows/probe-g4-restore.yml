name: probe-g4-restore
on:
  workflow_dispatch:
permissions: {}
jobs:
  restore:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        cell: [a, b, c]
    env:
      CELL: ${{ matrix.cell }}
      STATE_PATH: stacks/${{ matrix.cell }}/.state/dev/terraform.tfstate
    steps:
      - id: same
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stacks/${{ matrix.cell }}/.state/dev/terraform.tfstate
          key: state/probe-g4-${{ matrix.cell }}/dev/restore-miss
          restore-keys: state/probe-g4-${{ matrix.cell }}/dev/
      - name: Compare same-path bytes
        env:
          HIT: ${{ steps.same.outputs.cache-hit }}
          MATCHED: ${{ steps.same.outputs.cache-matched-key }}
        run: |
          echo "same path: cache-hit='$HIT' matched='$MATCHED'"
          if [ -z "$MATCHED" ]; then echo "same path: MISS"; exit 0; fi
          plain=$(openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:probe -in "$STATE_PATH")
          echo "decrypted: $plain"
          want=$(printf '{"cell":"%s","run":"%s"}' "$CELL" "${MATCHED##*/}")
          if [ "$plain" = "$want" ]; then echo "same path: BYTES MATCH key suffix"; else echo "same path: BYTES DIFFER from $want"; exit 1; fi
          rm -rf stacks
      - id: dot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./stacks/${{ matrix.cell }}/.state/dev/terraform.tfstate
          key: state/probe-g4-${{ matrix.cell }}/dev/restore-miss
          restore-keys: state/probe-g4-${{ matrix.cell }}/dev/
      - id: abs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/stacks/${{ matrix.cell }}/.state/dev/terraform.tfstate
          key: state/probe-g4-${{ matrix.cell }}/dev/restore-miss
          restore-keys: state/probe-g4-${{ matrix.cell }}/dev/
      - env:
          DOT: ${{ steps.dot.outputs.cache-matched-key }}
          ABS: ${{ steps.abs.outputs.cache-matched-key }}
        run: |
          echo "./ path: matched='$DOT'"
          echo "absolute path: matched='$ABS'"
          ls -la stacks/*/.state/dev/ 2>&1 || true
