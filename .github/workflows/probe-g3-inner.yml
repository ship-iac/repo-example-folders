name: probe-g3-inner
on:
  workflow_call:
    inputs:
      hold: { required: true, type: string }
concurrency:
  group: probe-g3-cancel
  cancel-in-progress: false
  queue: max
permissions: {}
jobs:
  work:
    runs-on: ubuntu-slim
    steps:
      - run: sleep ${{ inputs.hold }}
  final:
    needs: work
    if: always()
    runs-on: ubuntu-slim
    steps:
      - run: echo "work=${{ needs.work.result }}"
