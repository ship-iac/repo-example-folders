name: probe-g3-cancel
# Temporary: what runs when a run is cancelled while its called workflow waits in a queue group.
on:
  workflow_dispatch:
    inputs:
      hold: { required: false, default: '90' }
permissions: {}
jobs:
  outer:
    runs-on: ubuntu-slim
    steps:
      - run: echo outer
  call:
    needs: outer
    uses: ./.github/workflows/probe-g3-inner.yml
    with:
      hold: ${{ inputs.hold }}
  after:
    needs: [outer, call]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - run: echo "call=${{ needs.call.result }} outer=${{ needs.outer.result }}"
