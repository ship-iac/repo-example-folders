name: probe-g3-out-inner
on:
  workflow_call:
    inputs:
      hold: { required: true, type: string }
    outputs:
      a_result: { value: "${{ jobs.a.result }}" }
      a_out: { value: "${{ jobs.a.outputs.x }}" }
      b_result: { value: "${{ jobs.b.result }}" }
concurrency:
  group: probe-g3-out
  cancel-in-progress: false
  queue: max
permissions: {}
jobs:
  a:
    runs-on: ubuntu-slim
    outputs:
      x: ${{ steps.s.outputs.x }}
    steps:
      - id: s
        run: echo "x=1" >> "$GITHUB_OUTPUT"
  b:
    needs: a
    runs-on: ubuntu-slim
    steps:
      - run: sleep ${{ inputs.hold }}
